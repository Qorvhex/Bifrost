name: Build Bifrost APK

on:
  push:
    branches: [ "main", "master", "prerelease" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master", "prerelease" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Setup Production Release Keystore
        env:
          SIGN_KEY_BASE64: ${{ secrets.SIGN_KEY_BASE64 }}
          SIGN_CERT_BASE64: ${{ secrets.SIGN_CERT_BASE64 }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEY_CLEAN=$(echo "$SIGN_KEY_BASE64" | tr -d '\r\n[:space:]')
          CERT_CLEAN=$(echo "$SIGN_CERT_BASE64" | tr -d '\r\n[:space:]')
          KEYSTORE_CLEAN=$(echo "$KEYSTORE_BASE64" | tr -d '\r\n[:space:]')

          if [ -n "$KEY_CLEAN" ] && [ -n "$CERT_CLEAN" ]; then
            echo "Configuring custom PKCS#8 key and X.509 certificate..."
            echo "$KEY_CLEAN" | base64 -d > app/private_key.pk8
            echo "$CERT_CLEAN" | base64 -d > app/certificate.pem

            # Normalize PEM formatting (ensure proper RFC 7468 headers and line breaks)
            python3 -c 'import re; t = open("app/certificate.pem", "r", encoding="utf-8", errors="ignore").read(); b = re.sub(r"-----[^-]+-----|\s+", "", t); open("app/certificate.pem", "w", encoding="utf-8").write("-----BEGIN CERTIFICATE-----\n" + "\n".join(b[i:i+64] for i in range(0, len(b), 64)) + "\n-----END CERTIFICATE-----\n")'

            # Convert PKCS#8 DER private key to PEM
            openssl pkcs8 -in app/private_key.pk8 -inform DER -out app/private_key.pem -nocrypt

            # Package certificate and private key into standard PKCS12/JKS keystore for Gradle
            openssl pkcs12 -export \
              -in app/certificate.pem \
              -inkey app/private_key.pem \
              -out app/release-keystore.jks \
              -name bifrost \
              -password pass:bifrost123

            # Securely remove temporary raw key files
            rm -f app/private_key.pk8 app/private_key.pem app/certificate.pem

            echo "KEY_ALIAS=bifrost" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=bifrost123" >> $GITHUB_ENV
            echo "KEY_PASSWORD=bifrost123" >> $GITHUB_ENV
          elif [ -n "$KEYSTORE_CLEAN" ]; then
            echo "Using custom release keystore from repository secrets..."
            echo "$KEYSTORE_CLEAN" | base64 -d > app/release-keystore.jks
            echo "KEY_ALIAS=${KEY_ALIAS_SECRET:-bifrost}" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD_SECRET:-bifrost123}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASSWORD_SECRET:-bifrost123}" >> $GITHUB_ENV
          else
            echo "Generating fallback production release keystore for signing..."
            keytool -genkeypair -v \
              -keystore app/release-keystore.jks \
              -alias bifrost \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass bifrost123 \
              -keypass bifrost123 \
              -dname "CN=Bifrost Release, OU=Security, O=Bifrost, L=San Francisco, ST=California, C=US"
            echo "KEY_ALIAS=bifrost" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=bifrost123" >> $GITHUB_ENV
            echo "KEY_PASSWORD=bifrost123" >> $GITHUB_ENV
          fi

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK Signature
        run: |
          APK_FILE=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            echo "Verifying cryptographic signature of: $APK_FILE"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose --print-certs "$APK_FILE" || true
          fi

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Bifrost-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
