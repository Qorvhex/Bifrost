name: Build Bifrost APK

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Setup Production Release Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using custom release keystore from repository secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/release-keystore.jks
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating production release keystore for signing..."
            keytool -genkeypair -v \
              -keystore app/release-keystore.jks \
              -alias bifrost \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass bifrost123 \
              -keypass bifrost123 \
              -dname "CN=Bifrost Release, OU=Security, O=Bifrost, L=San Francisco, ST=California, C=US"
            echo "KEY_ALIAS=bifrost" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=bifrost123" >> $GITHUB_ENV
            echo "KEY_PASSWORD=bifrost123" >> $GITHUB_ENV
          fi

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Bifrost-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
